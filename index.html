<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo Giải Ngân | Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'Segoe UI', system-ui, Arial, sans-serif; background: #f0f2f5; }

    /* ══ 1. GIAO DIỆN MÀN HÌNH ĐĂNG NHẬP ══ */
    #loginScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      backdrop-filter: blur(8px);
    }
    #loginScreen.h { display: none !important; }

    .login-box {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .login-box h2 {
      margin: 0 0 10px 0;
      color: #1e293b;
      font-size: 20px;
      font-weight: 700;
    }
    .login-box p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    .g-btn-wrapper {
      display: flex;
      justify-content: center;
      min-height: 44px;
      margin-bottom: 10px;
    }
    #loginLoading {
      display: none;
      color: #2563eb;
      font-weight: 600;
      font-size: 14px;
      margin-top: 15px;
    }
    #loginLoading.s { display: block !important; }
    #loginErr {
      display: none;
      color: #dc2626;
      font-size: 13px;
      line-height: 1.4;
      margin-top: 15px;
      background: #fef2f2;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #fecaca;
    }
    #loginErr.s { display: block !important; }

    /* ══ 2. GIAO DIỆN MAIN DASHBOARD ══ */
    .topbar {
      background: linear-gradient(135deg, #0a1628 0%, #1B3A6B 50%, #1e4d8c 100%);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .brand-txt strong {
      font-size: 12px; font-weight: 700; color: #fff;
      display: block; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;
    }
    .brand-txt span {
      font-size: 10px; color: rgba(255,255,255,.5);
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px;
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .tr { display: flex; align-items: center; gap: 8px; }
    .chip {
      background: rgba(255,255,255,.15);
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
    }
    .topbar-right .date {
      font-size: 11px; color: rgba(255,255,255,.6);
      padding: 4px 12px; background: rgba(255,255,255,.08);
      border-radius: 16px; border: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }
    .topbar-right .badge {
      font-size: 10px; font-weight: 600; color: #7DD3FC;
      padding: 3px 10px; background: rgba(125,211,252,.12);
      border-radius: 12px; border: 1px solid rgba(125,211,252,.2);
      white-space: nowrap;
    }

    .main-wrap {
      height: calc(100vh - 56px);
      width: 100%;
      padding: 8px;
      background: #e8ecf1;
    }
    .iframe-container {
      width: 100%; height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      background: #fff;
      position: relative;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* Responsive */
    @media(max-width:768px){
      .topbar{padding:0 12px;height:50px}
      .seal{width:30px;height:30px;font-size:14px}
      .brand-txt strong{font-size:10px;max-width:140px}
      .brand-txt span{display:none}
      .main-wrap{padding:4px}
      .iframe-container{border-radius:6px}
    }
  </style>
</head>
<body>

  <div id="loginScreen">
    <div class="login-box">
      <h2>ĐĂNG NHẬP HỆ THỐNG</h2>
      <p>Ban QLDA Đầu tư Xây dựng các Công trình Giao thông và Nông nghiệp Đà Nẵng</p>
      
      <div class="g-btn-wrapper">
        <div id="g_id_onload"></div>
      </div>
      
      <div id="loginLoading">⏳ Đang xác thực tài khoản...</div>
      <div id="loginErr"></div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="seal">🏛️</div>
      <div class="brand-txt">
        <strong>BAN QLDA GIAO THÔNG &amp; NÔNG NGHIỆP ĐÀ NẴNG</strong>
        <span>Báo cáo Giải Ngân · Năm kế hoạch 2026</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="tr"></div>
      <span class="badge">📊 KH 2026</span>
      <span class="date" id="currentDate">--</span>
    </div>
  </header>

  <div class="main-wrap">
    <div class="iframe-container">
      <iframe 
        src="https://datastudio.google.com/embed/reporting/5634896d-227b-43c8-8eb4-225370996309/page/QnN5F" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>

  <script>
  // Cập nhật ngày tháng
  document.addEventListener('DOMContentLoaded', function() {
    const now = new Date();
    const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
    document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);
  });

  // DANH SÁCH 11 EMAIL ĐƯỢC PHÉP TRUY CẬP
  const ALLOWED_EMAILS = [
    'vuongkts2909@gmail.com',
    'duongnd80@gmail.com',
    'dovanthaonhs@gmail.com',
    'thuongdagt@gmail.com',
    'duyanhdn@gmail.com',
    'ducvpubdn@gmail.com',
    'hoangbql78@gmail.com',
    'hothuy73@gmail.com',
    'nguyentuanphongqlda@gmail.com',
    'minhpq2006@gmail.com',
    'ngoctanqldt@gmail.com'
  ];

  // Giải mã UTF-8 JWT Token
  function decodeJwtResponse(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    } catch (e) {
      return null;
    }
  }

  // Xử lý sau khi chọn tài khoản Google
  function handleGoogleLogin(response) {
    const loadingEl = document.getElementById('loginLoading');
    const errEl = document.getElementById('loginErr');
    
    if (loadingEl) loadingEl.classList.add('s');
    if (errEl) errEl.classList.remove('s');

    try {
      const payload = decodeJwtResponse(response.credential);
      if (!payload) throw new Error("Decode Failed");

      const email = (payload.email || '').toLowerCase().trim();
      const name = payload.name || email;

      if (ALLOWED_EMAILS.map(e => e.toLowerCase()).includes(email)) {
        sessionStorage.setItem('qlda_auth', '1');
        sessionStorage.setItem('qlda_user', name);

        document.getElementById('loginScreen').classList.add('h');
        if (loadingEl) loadingEl.classList.remove('s');

        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = '👤 <b>' + name.split(' ').pop() + '</b>';
        document.querySelector('.tr').prepend(chip);
      } else {
        if (loadingEl) loadingEl.classList.remove('s');
        if (errEl) {
          errEl.innerHTML = '⛔ Tài khoản <b>' + email + '</b> không có quyền truy cập.<br>Liên hệ quản trị viên để được cấp quyền.';
          errEl.classList.add('s');
        }

        const loginBox = document.querySelector('.login-box');
        if (loginBox) {
          loginBox.style.animation = 'shake .3s ease';
          setTimeout(() => loginBox.style.animation = '', 400);
        }

        if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
      }
    } catch (e) {
      if (loadingEl) loadingEl.classList.remove('s');
      if (errEl) {
        errEl.innerHTML = '❌ Lỗi xác thực tài khoản. Vui lòng thử lại!';
        errEl.classList.add('s');
      }
    }
  }

  // Khởi tạo SDK Đăng nhập Google
  window.addEventListener('load', function () {
    if (sessionStorage.getItem('qlda_auth') === '1') {
      document.getElementById('loginScreen').classList.add('h');
      const name = sessionStorage.getItem('qlda_user') || 'User';
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = '👤 <b>' + name.split(' ').pop() + '</b>';
      document.querySelector('.tr').prepend(chip);
      return;
    }

    if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: '532346952448-g96goj4pacl285blr3pep9k0shbhjel1.apps.googleusercontent.com',
        callback: handleGoogleLogin
      });

      google.accounts.id.renderButton(
        document.getElementById('g_id_onload'),
        { theme: 'outline', size: 'large', width: '280', text: 'signin_with' }
      );
    }
  });
  </script>
</body>
</html>
