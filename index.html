<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo cáo Giải Ngân | Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      font-family: 'Segoe UI', system-ui, Arial, sans-serif; 
      background: #f0f2f5;
    }

    /* === TOPBAR === */
    .topbar {
      background: linear-gradient(135deg, #0a1628 0%, #1B3A6B 50%, #1e4d8c 100%);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: relative;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .seal {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 2px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .brand-txt strong {
      font-size: 13px; font-weight: 700; color: #fff;
      display: block; line-height: 1.2;
      white-space: nowrap;
    }
    .brand-txt span {
      font-size: 10px; color: rgba(255,255,255,.5);
      display: block;
    }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .topbar-right .badge {
      font-size: 10px; font-weight: 600; color: #7DD3FC;
      padding: 4px 12px; background: rgba(125,211,252,.12);
      border-radius: 14px; border: 1px solid rgba(125,211,252,.18);
      white-space: nowrap;
    }
    .topbar-right .date {
      font-size: 11px; color: rgba(255,255,255,.6);
      padding: 4px 14px; background: rgba(255,255,255,.06);
      border-radius: 14px; border: 1px solid rgba(255,255,255,.06);
      white-space: nowrap;
    }

    /* === MAIN CONTENT === */
    .main-wrap {
      height: calc(100vh - 52px);
      width: 100%;
      padding: 6px 8px 8px 8px;
      background: #e8ecf1;
    }
    .iframe-container {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      background: #fff;
      position: relative;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .topbar { padding: 0 14px; height: 48px; }
      .seal { width: 28px; height: 28px; font-size: 13px; }
      .brand-txt strong { font-size: 11px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
      .brand-txt span { display: none; }
      .topbar-right .badge { font-size: 9px; padding: 2px 10px; }
      .topbar-right .date { font-size: 10px; padding: 2px 10px; }
      .main-wrap { padding: 4px 4px 6px 4px; height: calc(100vh - 48px); }
      .iframe-container { border-radius: 6px; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 0 10px; height: 44px; }
      .seal { width: 24px; height: 24px; font-size: 11px; }
      .brand-txt strong { font-size: 10px; max-width: 100px; }
      .topbar-right .badge { display: none; }
      .topbar-right .date { font-size: 9px; padding: 2px 8px; }
      .main-wrap { padding: 2px 2px 4px 2px; height: calc(100vh - 44px); }
      .iframe-container { border-radius: 4px; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="seal">🏛️</div>
      <div class="brand-txt">
        <strong>BAN GIAO THÔNG &amp; NÔNG NGHIỆP ĐN</strong>
        <span>Báo cáo Giải Ngân · Kế hoạch 2025-2026</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge">📊 KH 2026</span>
      <span class="date" id="currentDate">--</span>
    </div>
  </header>

  <div class="main-wrap">
    <div class="iframe-container">
      <iframe 
        src="https://datastudio.google.com/embed/reporting/1cd97460-6826-4c57-9bb7-7d04e075b2e1/page/QnN5F" 
        allowfullscreen 
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
      </iframe>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);
    });
  </script>
</body>
</html>
