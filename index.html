<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo Giải Ngân | Ban QLDA Giao thông & Nông nghiệp Đà Nẵng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f0f2f5}

/* TOPBAR */
.topbar{
  background:linear-gradient(135deg,#0a1628 0%,#1B3A6B 50%,#1e4d8c 100%);
  padding:0 20px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.25);
  flex-shrink:0
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0
}
.brand-txt strong{
  font-size:12px;font-weight:700;color:#fff;
  display:block;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px
}
.brand-txt span{
  font-size:10px;color:rgba(255,255,255,.5);
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px
}
.topbar-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-right .date{
  font-size:11px;color:rgba(255,255,255,.6);
  padding:4px 12px;background:rgba(255,255,255,.08);
  border-radius:16px;border:1px solid rgba(255,255,255,.08);
  white-space:nowrap
}
.topbar-right .badge{
  font-size:10px;font-weight:600;color:#7DD3FC;
  padding:3px 10px;background:rgba(125,211,252,.12);
  border-radius:12px;border:1px solid rgba(125,211,252,.2);
  white-space:nowrap
}

/* IFRAME WRAPPER */
.main-wrap{
  height:calc(100vh - 56px);
  width:100%;
  padding:8px;
  background:#e8ecf1
}
.iframe-container{
  width:100%;
  height:100%;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.08);
  background:#fff;
  position:relative
}
.iframe-container iframe{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  border:0;
  display:block
}

/* RESPONSIVE */
@media(max-width:768px){
  .topbar{padding:0 12px;height:50px}
  .seal{width:30px;height:30px;font-size:14px}
  .brand-txt strong{font-size:10px;max-width:120px}
  .brand-txt span{display:none}
  .topbar-right .date{font-size:9px;padding:2px 8px}
  .topbar-right .badge{font-size:9px;padding:2px 8px}
  .main-wrap{padding:4px}
  .iframe-container{border-radius:6px}
}
@media(max-width:480px){
  .topbar{padding:0 8px;height:46px}
  .seal{width:26px;height:26px;font-size:12px}
  .brand-txt strong{font-size:9px;max-width:80px}
  .topbar-right .date{font-size:8px;padding:2px 6px}
  .topbar-right .badge{display:none}
  .main-wrap{padding:2px}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="brand">
    <div class="seal">🏛️</div>
    <div class="brand-txt">
      <strong>BAN QLDA GIAO THÔNG &amp; NÔNG NGHIỆP ĐÀ NẴNG</strong>
      <span>Báo cáo Giải Ngân · Năm kế hoạch 2026</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="badge">📊 KH 2026</span>
    <span class="date" id="currentDate">--</span>
  </div>
</header>

<!-- IFRAME -->
<div class="main-wrap">
  <div class="iframe-container">
    <iframe 
      src="https://datastudio.google.com/embed/reporting/5634896d-227b-43c8-8eb4-225370996309/page/QnN5F" 
      allowfullscreen 
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </div>
</div>

<script>
// Hiển thị ngày hiện tại
document.addEventListener('DOMContentLoaded', function() {
  const now = new Date();
  const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
  document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);
});
</script>

</body>
</html>
